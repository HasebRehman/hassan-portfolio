<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Sara, AI assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ff9a4d"/>
      <stop offset="55%" stop-color="#ff5b1f"/>
      <stop offset="100%" stop-color="#d4350e"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2219"/>
      <stop offset="100%" stop-color="#1e110c"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .head { transform-origin: 100px 150px; animation: tilt 7s ease-in-out infinite; }
      .body { animation: breathe 4s ease-in-out infinite; }
      .eye  { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      @keyframes tilt {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        55% { transform: rotate(2.5deg); }
        78% { transform: rotate(0.5deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.2px); }
      }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        92% { transform: scaleY(0.08); }
        94% { transform: scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .head, .body, .eye { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- hair back (moves with head, sits behind neck) -->
    <g class="head">
      <path d="M58 92 C55 54 78 36 100 36 C124 36 147 54 143 94 C143 118 150 138 147 156 L53 156 C50 138 58 118 58 92 Z" fill="url(#hair)"/>
      <path d="M126 60 C138 74 140 100 138 130" stroke="#5a3526" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- shoulders + neck -->
    <g class="body">
      <path d="M22 205 C26 168 58 150 100 148 C142 150 174 168 178 205 Z" fill="#1d1412"/>
      <path d="M84 150 L100 176 L116 150 Z" fill="#d99873"/>
      <path d="M86 116 L86 152 Q100 162 114 152 L114 116 Z" fill="#d99873"/>
      <path d="M86 120 Q100 134 114 120 L114 128 Q100 139 86 128 Z" fill="#b8744f" opacity="0.55"/>
    </g>

    <!-- head -->
    <g class="head">
      <!-- ears -->
      <ellipse cx="70" cy="96" rx="5" ry="8" fill="#d99873"/>
      <ellipse cx="130" cy="96" rx="5" ry="8" fill="#d99873"/>
      <circle cx="70" cy="107" r="2.6" fill="#ffd166"/>
      <!-- face -->
      <ellipse cx="100" cy="92" rx="30" ry="36" fill="#e3a47d"/>
      <circle cx="82" cy="104" r="5.5" fill="#ff6f4e" opacity="0.28"/>
      <circle cx="118" cy="104" r="5.5" fill="#ff6f4e" opacity="0.28"/>
      <!-- brows -->
      <path d="M79 80 Q87 75 95 79" stroke="#2a1812" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M105 79 Q113 75 121 80" stroke="#2a1812" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- eyes -->
      <g class="eye">
        <ellipse cx="88" cy="91" rx="4.6" ry="3.4" fill="#231410"/>
        <circle cx="89.6" cy="89.8" r="1.2" fill="#fff"/>
        <path d="M82 89 Q88 84.5 94.5 88.5" stroke="#231410" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
      <g class="eye">
        <ellipse cx="112" cy="91" rx="4.6" ry="3.4" fill="#231410"/>
        <circle cx="113.6" cy="89.8" r="1.2" fill="#fff"/>
        <path d="M105.5 88.5 Q112 84.5 118 89" stroke="#231410" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
      <!-- nose -->
      <path d="M100 95 Q97.5 102 100 104.5 Q102 105.5 104 103.5" stroke="#b8744f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- lips -->
      <path d="M91 112 Q100 119 109 112 Q100 114.5 91 112 Z" fill="#b8443a"/>
      <!-- hair front, side-swept -->
      <path d="M66 90 C63 58 84 44 104 46 C124 48 137 62 134 88 C127 71 113 61 97 63 C84 65 72 75 66 90 Z" fill="url(#hair)"/>
      <!-- headset -->
      <circle cx="130" cy="97" r="6.5" fill="#1d1412"/>
      <circle cx="130" cy="97" r="3" fill="#ff7a33"/>
      <path d="M131 103 Q133 117 112 120" stroke="#1d1412" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="111" cy="120" r="2.8" fill="#1d1412"/>
    </g>
  </g>
</svg>
